<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #0f2c24;
      --chalk: #f2c14e;
      --glass: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #f0f4f2;
      --muted: rgba(240, 244, 242, 0.75);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(15,44,36,0.85), rgba(15,44,36,0.9)),
                  url('hero-bg.jpg') center/cover no-repeat fixed;
      padding: 20px;
    }
    .login-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: white;
      padding: 5px;
      margin-bottom: 12px;
    }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 26px;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }
    input:focus {
      border-color: var(--chalk);
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--chalk);
      color: var(--pine);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(242,193,78,0.3);
    }
    .error {
      background: rgba(220, 53, 69, 0.2);
      color: #ff8a80;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      display: none;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }
    .back:hover { color: var(--chalk); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
      <h1>Student Login</h1>
      <p class="subtitle">Enter your Registration ID and Password</p>
    </div>

    <div class="error" id="errorMsg"></div>

    <form id="loginForm">
      <label>Registration ID</label>
      <input type="text" id="regId" placeholder="e.g. STU001" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>
    </form>

    <a href="index.html" class="back">← Back to Home</a>
  </div>

  <script>
    const API = "http://localhost:8080/api";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const regId = document.getElementById("regId").value.trim();
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("errorMsg");

      errorMsg.style.display = "none";

      try {
        const res = await fetch(`${API}/student/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            registration_id: regId,
            password: password
          })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || "Login failed";
          errorMsg.style.display = "block";
          return;
        }

        // Save student data in browser
        localStorage.setItem("student", JSON.stringify(data.student));

        // Redirect to student dashboard
        window.location.href = "student-dashboard.html";

      } catch (err) {
        errorMsg.textContent = "Cannot connect to server. Make sure backend is running.";
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
